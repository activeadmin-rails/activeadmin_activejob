plugins:
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "spec/dummy/db/schema.rb"
    - "spec/dummy/bin/*"
    - "gemfiles/vendor/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/AbcSize:
  Max: 25

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "lib/activeadmin/jobs/config.rb" # declarative resource configuration

Metrics/ModuleLength:
  Max: 160

# Adapter actions return whether they succeeded.
Naming/PredicateMethod:
  Enabled: false

# Job record classes are not ActiveRecord: .all returns a JobQuery or Array.
Rails/RedundantActiveRecordAllMethod:
  Enabled: false

# params.expect needs Rails 8.
Rails/StrongParametersExpect:
  Enabled: false

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 5

# The dummy app boots outside RSpec (e.g. `rails dartsass:build`).
Packaging/BundlerSetupInTests:
  Exclude:
    - "spec/dummy/config/boot.rb"
